name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "icon.svg"
      - "manifest.webmanifest"
      - "sw.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor
        run: npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Prepare app web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp icon.svg www/icon.svg
          cp manifest.webmanifest www/manifest.webmanifest
          cp sw.js www/sw.js

      - name: Generate Android project
        run: npx cap add android

      - name: Sync app
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Android App Bundle
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: advanced-cgpa-android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
