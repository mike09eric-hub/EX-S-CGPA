name: Build Advanced CGPA Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare web app assets
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html app/src/main/assets/www/index.html
          [ ! -f manifest.webmanifest ] || cp manifest.webmanifest app/src/main/assets/www/
          [ ! -f icon.svg ] || cp icon.svg app/src/main/assets/www/
          [ ! -f sw.js ] || cp sw.js app/src/main/assets/www/
      - name: Build installable APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Advanced-CGPA-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
